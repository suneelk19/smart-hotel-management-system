{% extends 'base.html' %}

{% block title %}Add Room{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Add Room</h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success">
                    Save Room
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
