{% extends 'base.html' %}

{% block title %}
Payment
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Payment</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-success">

                    Pay Now

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
