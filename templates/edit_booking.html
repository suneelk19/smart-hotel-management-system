{% extends 'base.html' %}

{% block title %}
Edit Booking
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Booking</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Update Booking
        </button>

        <a href="{% url 'booking_list' %}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
