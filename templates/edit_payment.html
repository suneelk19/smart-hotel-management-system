{% extends 'base.html' %}

{% block title %}
Edit Payment
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Payment</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary">
            Update Payment
        </button>

        <a href="{% url 'payment_list' %}"
            class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
