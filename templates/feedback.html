{% extends 'base.html' %}

{% block title %}
Feedback
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Hotel Feedback</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">

                    Submit Feedback

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
