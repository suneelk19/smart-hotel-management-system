{% extends 'base.html' %}

{% block title %}
Add Booking
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add New Booking</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Save Booking
                </button>

                {% if user.is_staff %}
                <a href="{% url 'booking_list' %}" class="btn btn-secondary">
                    Back
                </a>
                {% else %}
                <a href="{% url 'rooms' %}" class="btn btn-secondary">
                    Back
                </a>
                {% endif %}

            </form>

        </div>

    </div>

</div>

{% endblock %}
