{% extends 'base.html' %}

{% block title %}Edit Room{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Edit Room</h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">
                    Update Room
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
